[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "x4-sandbox"
version = "0.2.0"
description = "Policy-gated, auditable process execution for X4 agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []
[project.scripts]
x4-sandbox = "x4.sandbox.cli:main"
[tool.setuptools.packages.find]
include = ["x4*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
