[build-system]
requires = ["setuptools>=69,<82", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "x4-sandbox"
version = "0.3.0"
description = "Policy-gated process and Docker container execution for X4 agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.2,<10", "ruff>=0.9,<1"]

[project.scripts]
x4-sandbox = "x4.sandbox.cli:main"

[tool.setuptools.packages.find]
include = ["x4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
